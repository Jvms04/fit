name: Repository governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  wp001-governance:
    name: wp001-governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked metadata
        run: npm ci --ignore-scripts
      - name: Verify WP-001 governance
        run: npm run verify:wp001
