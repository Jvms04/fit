name: Governance

on:
  pull_request:
  push:
    branches: [main, wp-001-governance]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: 24.19.0
      - run: npm run verify:governance
      - run: npm test
      - run: npm pack --dry-run
